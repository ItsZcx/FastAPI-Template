$schema: https://api.gitbook.com/gitbook-docs.yaml

# GitBook Site Git Sync configuration for the FastAPI Template docs.
#
# The documentation content lives in the repository under `docs/`, organised
# into three content directories. Each existing directory becomes one GitBook
# space; there is no repository directory grouping these spaces further up, so
# the site uses a flat, space-only structure.
site:
  title: FastAPI Template
  structure:
    - type: space
      key: developer-manual
      title: Developer Manual
      path: developer-manual
      default: true
      content:
        directory: ./docs/developer-manual
        language: en
    - type: space
      key: architecture
      title: Architecture
      path: architecture
      content:
        directory: ./docs/architecture
        language: en
    - type: space
      key: contributing
      title: Contributing
      path: contributing
      content:
        directory: ./docs/contributing
        language: en
