$schema: https://api.gitbook.com/gitbook-docs.yaml

# GitBook Site Git Sync configuration for the FastAPI Template docs.
#
# This file lives in docs/ and is the GitBook project directory. The content
# directories below resolve relative to this file, so a space pointing at
# ./developer-manual reads docs/developer-manual in the repository.
site:
  title: FastAPI Template
  structure:
    - type: space
      key: introduction
      title: Introduction
      path: introduction
      default: true
      content:
        directory: ./introduction
        language: en
    - type: space
      key: developer-manual
      title: Developer Manual
      path: developer-manual
      content:
        directory: ./developer-manual
        language: en
    - type: space
      key: architecture
      title: Architecture
      path: architecture
      content:
        directory: ./architecture
        language: en
    - type: space
      key: contributing
      title: Contributing
      path: contributing
      content:
        directory: ./contributing
        language: en
