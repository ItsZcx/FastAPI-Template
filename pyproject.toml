[project]
name = "fastapi-template"
version = "0.1.0"
description = "Template for a FastAPI project with UV, SQLAlchemy, Alembic and Docker"
readme = "README.md"
authors = [{ name = "ItsZcx", email = "joanpaumeridaruiz@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.2,<2.0.0",
    "fastapi[standard]>=0.141.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "slowapi>=0.1.10,<0.2.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "structlog>=26.1.0,<27.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.6.5,<0.7.0",
]

#==================================#
#       Custom ruff settings       #
#==================================#

[tool.ruff]
# Inherit exclude patterns from ruff.toml
extend-exclude = [".venv", ".env", "alembic"]

# Other settings from ruff.toml
fix = true
line-length = 120
indent-width = 4

target-version = "py310"

[tool.ruff.format]
preview = false
line-ending = "lf"
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 110
skip-magic-trailing-comma = false

[tool.ruff.lint]
fixable = ["ALL"]
ignore = []
preview = false
extend-ignore = []
extend-fixable = []
allowed-confusables = []
explicit-preview-rules = false
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
